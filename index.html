<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;700&display=swap" rel="stylesheet">  
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>Habit Tracker</h1>
        <p class="subtitle">Small habits, big changes</p>

        <form id="habit-form">
            <input type="text" id="habit-input" placeholder="Write a new habit..." required>
            <button type="submit">Add</button>
        </form>

       <p id="progress">0 of 0 habits completed</p>
         <div class="progress-bar">
      <div id="progress-fill"></div>
      </div>

        <ul id="habit-list"></ul>
        <p id="empty-message">No habits yet. Add your first one above ✨</p>
    </main>

    <script src="script.js"></script>
</body>
</html>
